<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../styles/index.css" />
    <!-- SEO Meta Tags -->
    <title>Beastify | Interactive Animal Experience</title>
    <meta
      name="description"
      content="Beastify is an interactive platform that allows users to connect with animals like never before. Explore, learn, and have fun with a variety of animal experiences designed to bring you closer to the animal kingdom."
    />
    <meta
      name="keywords"
      content="animals, interactive, wildlife, education, fun, animal experiences, connect with nature, animal kingdom, learning, exploration, animal kingdom, augmented reality, virtual reality, animal simulation"
    />

    <meta name="author" content="Krish Bharadwaj" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical -->
    <link rel="canonical" href="https://beastify.onrender.com/" />

    <!-- Mobile & PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Beastify" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Beastify",
        "url": "https://beastify.onrender.com/",
        "applicationCategory": "MultimediaApplication",
        "genre": ["Interactive", "Educational", "Entertainment"],
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern web browser with WebGL support",
        "description": "Beastify is an interactive platform that allows users to connect with animals like never before. Explore, learn, and have fun with a variety of animal experiences designed to bring you closer to the animal kingdom.",
        "author": {
          "@type": "Person",
          "name": "Krish Bharadwaj"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "13432"
        }
      }
    </script>
  </head>
  <body class="bg-[#edece8] w-full h-screen">
    <!-- Top Left Blob -->
    <div class="blob"></div>

    <!-- Secondary Blob -->
    <div class="wavy hidden lg:block"></div>

    <!-- Main Content -->
    <div
      class="main flex flex-col lg:flex-row items-center justify-between px-6 md:px-12 lg:px-25 py-12 md:py-16 lg:py-20"
    >
      <!-- Left Content -->
      <div class="left w-full lg:w-1/2 text-center lg:text-left mt-35">
        <h1
          class="heading text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold"
        >
          Connect with Animals Like <br />
          Never Before
        </h1>

        <p
          class="subhead mt-2 text-sm sm:text-base md:text-lg text-gray-700 max-w-xl mx-auto lg:mx-0"
        >
          Discover the joy of connecting with animals through our interactive
          platform. Explore, learn, and have fun with a variety of animal
          experiences designed to bring you closer to the animal kingdom.
        </p>

        <div class="mt-6">
          <a href="loader.html">
            <button>Explore Now</button>
          </a>
        </div>
      </div>

      <!-- Right Content -->
      <div class="right w-full lg:w-1/2 flex justify-center mt-10 lg:mt-28">
        <img
          class="w-[300px] sm:w-[400px] md:w-[550px] lg:w-[700px] xl:w-[800px] h-auto"
          src="https://duijvlhczqtcbtnwvrvm.supabase.co/storage/v1/object/public/Beastify/images/animals.png"
          alt="Animals"
        />
      </div>
    </div>
  </body>
</html>
